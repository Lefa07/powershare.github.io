<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Payment · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ PAYMENT ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
  <header class="topbar">
    <a href="#" class="back-btn" data-href="booking.html" aria-label="Go back">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <h2>Payment</h2>
    <div class="topbar-actions"><span style="width:40px"></span></div>
  </header>
      <div class="screen-content">
        <div class="section">
          <h3>Booking summary</h3>
          <div class="card stack-2" style="margin-top:12px" id="booking-summary"></div>
        </div>

        <div class="section">
          <h3>Payment method</h3>
          <div class="stack-3" style="margin-top:12px" data-pay-group>
            <label class="pay-method selected">
              <input type="radio" name="pay" value="card" checked style="display:none">
              <span class="radio-dot"></span>
              <span class="material-icons-outlined">credit_card</span>
              <div><h4>Card payment</h4><p>Visa, Mastercard</p></div>
            </label>
            <label class="pay-method">
              <input type="radio" name="pay" value="eft" style="display:none">
              <span class="radio-dot"></span>
              <span class="material-icons-outlined">account_balance</span>
              <div><h4>EFT</h4><p>Instant bank transfer</p></div>
            </label>
            <label class="pay-method">
              <input type="radio" name="pay" value="cash" style="display:none">
              <span class="radio-dot"></span>
              <span class="material-icons-outlined">payments</span>
              <div><h4>Cash on pickup</h4><p>Pay at the hub</p></div>
            </label>
          </div>
        </div>

        <div id="card-fields" class="section">
          <h3>Card details</h3>
          <div class="field" style="margin-top:12px">
            <label for="card-number">Card number</label>
            <input type="text" id="card-number" placeholder="4242 4242 4242 4242" inputmode="numeric">
          </div>
          <div class="field-row">
            <div class="field"><label for="card-expiry">Expiry</label><input type="text" id="card-expiry" placeholder="MM/YY"></div>
            <div class="field"><label for="card-cvc">CVC</label><input type="text" id="card-cvc" placeholder="123" inputmode="numeric"></div>
          </div>
        </div>
      </div>

      <div class="screen-content" style="padding-top:0">
        <button class="btn btn-primary" id="pay-btn">Pay now</button>
      </div>

      <script>
        const booking = PowerShare.store.get('currentBooking');
        const summaryEl = document.getElementById('booking-summary');
        if (booking?.bookingId) {
          summaryEl.innerHTML = `
            <div class="row-between"><span class="text-muted">Booking</span><strong>#${booking.bookingId}</strong></div>
            <div class="row-between"><span class="text-muted">Battery</span><strong>${booking.batteryName}</strong></div>
            <div class="row-between"><span class="text-muted">Dates</span><strong>${booking.start} → ${booking.end}</strong></div>
            <div class="divider" style="margin:8px 0"></div>
            <div class="row-between"><span style="font-weight:700">Total</span><strong style="color:var(--color-primary);font-size:17px">R${Number(booking.total || 0).toFixed(2)}</strong></div>`;
        } else {
          summaryEl.innerHTML = '<p>No active booking. Please return to the battery catalogue.</p>';
          document.getElementById('pay-btn').disabled = true;
        }

        document.querySelectorAll('input[name="pay"]').forEach(radio => {
          radio.addEventListener('change', () => { document.getElementById('card-fields').style.display = radio.value === 'card' ? '' : 'none'; });
        });

        document.getElementById('pay-btn').addEventListener('click', async () => {
          if (!booking?.bookingId) return;
          const method = document.querySelector('input[name="pay"]:checked')?.value?.toUpperCase();
          const btn = document.getElementById('pay-btn');
          btn.disabled = true; btn.textContent = 'Processing…';
          try {
            await PowerShareAPI.pay(booking.bookingId, method);
            PowerShare.store.set('currentBooking', { ...booking, paymentMethod: method, paymentCompleted: true });
            window.location.href = 'booking-confirmation.html';
          } catch (err) {
            PowerShare.toast(err.message || 'Payment could not be processed', 'error');
            btn.disabled = false; btn.textContent = 'Pay now';
          }
        });
      </script>
    </main>

  </div>
  
</body>
</html>
