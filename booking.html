<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Booking · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ BOOKING ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
  <header class="topbar">
    <a href="#" class="back-btn" data-href="battery-details.html" aria-label="Go back">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <h2>Booking</h2>
    <div class="topbar-actions"><span style="width:40px"></span></div>
  </header>
      <div class="screen-content">
        <div class="booking-progress" aria-label="Booking progress">
          <div class="booking-progress-step active"><span>1</span><small>Choose battery</small></div>
          <div class="booking-progress-line"></div>
          <div class="booking-progress-step active"><span>2</span><small>Rental details</small></div>
          <div class="booking-progress-line"></div>
          <div class="booking-progress-step"><span>3</span><small>Payment</small></div>
        </div>
        <div class="card row" style="gap:12px" id="summary-card"></div>

        <div class="section" style="margin-top:24px">
          <h3>Rental dates</h3>
          <div class="field-row" style="margin-top:12px">
            <div class="field">
              <label for="start-date">Pickup date</label>
              <input type="date" id="start-date">
            </div>
            <div class="field">
              <label for="end-date">Return date</label>
              <input type="date" id="end-date">
            </div>
          </div>
        </div>

        <div class="section">
          <h3>Pickup or delivery</h3>
          <div class="tab-row" data-panels="fulfilment" style="margin-top:12px">
            <button class="active" data-target="pickup">Pickup</button>
            <button data-target="delivery">Delivery</button>
          </div>
          <div data-panel-group="fulfilment" data-panel="pickup" style="margin-top:14px">
            <div class="card row" style="gap:10px">
              <span class="material-icons-outlined" style="color:var(--color-primary)">storefront</span>
              <div><h4 id="pickup-location">Claremont Hub</h4><p>Collect any time during opening hours</p></div>
            </div>
          </div>
          <div data-panel-group="fulfilment" data-panel="delivery" style="margin-top:14px;display:none">
            <div class="field"><label for="delivery-address">Delivery address</label><input type="text" id="delivery-address" placeholder="Street, suburb, city"></div>
            <p style="font-size:12.5px">Delivery fee of R60 applies within 15 km of the hub.</p>
          </div>
        </div>

        <div class="section">
          <h3>Quantity</h3>
          <div class="card row-between" style="margin-top:12px">
            <span>Number of batteries</span>
            <div class="stepper" data-min="1" data-max="4">
              <button data-step="dec" aria-label="Decrease quantity">&minus;</button>
              <span class="qty-value">1</span>
              <button data-step="inc" aria-label="Increase quantity">+</button>
            </div>
          </div>
        </div>

        <div class="section">
          <h3>Price summary</h3>
          <div class="card stack-2" style="margin-top:12px" id="price-summary"></div>
        </div>
      </div>

      <div class="screen-content" style="padding-top:0">
        <a href="payment.html" class="btn btn-primary" id="continue-btn">Continue to payment</a>
      </div>

      <script>
        const params = new URLSearchParams(window.location.search);
        const batteryId = params.get('id');
        let battery = null;
        let qty = 1;
        let days = 1;

        const start = document.getElementById('start-date');
        const end = document.getElementById('end-date');
        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);
        const inFour = new Date(today.getTime() + 4 * 86400000);
        start.value = todayStr;
        end.value = inFour.toISOString().slice(0, 10);
        start.min = todayStr;

        function recalcDays() {
          const s = new Date(start.value);
          const e = new Date(end.value);
          const diff = Math.round((e - s) / 86400000);
          days = diff > 0 ? diff : 1;
          renderPrice();
        }

        function renderPrice() {
          if (!battery) return;
          const rentalCost = Number(battery.rentalPricePerDay) * days * qty;
          document.getElementById('price-summary').innerHTML = `
            <div class="row-between"><span class="text-muted">Rental (${days} day${days > 1 ? 's' : ''} × ${qty})</span><strong>R${rentalCost.toFixed(2)}</strong></div>
            <div class="divider" style="margin:8px 0"></div>
            <div class="row-between"><span style="font-weight:700">Booking total</span><strong style="color:var(--color-primary);font-size:17px">R${rentalCost.toFixed(2)}</strong></div>`;
        }

        function renderBattery() {
          document.getElementById('summary-card').innerHTML = `
            <span class="material-icons" style="font-size:40px;color:var(--color-primary)">${PowerShareAPI.iconForCategory(battery.category?.name)}</span>
            <div><span class="eyebrow">${battery.category?.name || 'Battery'}</span><h4>${battery.name}</h4><p style="margin-top:2px">R${battery.rentalPricePerDay} /day</p></div>`;
          document.getElementById('pickup-location').textContent = 'PowerShare hub';
          renderPrice();
        }

        start.addEventListener('change', recalcDays);
        end.addEventListener('change', recalcDays);
        document.querySelector('.stepper').addEventListener('stepchange', e => { qty = e.detail.value; renderPrice(); });

        PowerShareAPI.getBattery(batteryId)
          .then(data => {
            battery = data;
            if (battery.status !== 'AVAILABLE') throw new Error('This battery is no longer available for booking');
            renderBattery();
          })
          .catch(err => {
            document.getElementById('summary-card').innerHTML = `<p>${err.message || 'Could not load this battery.'}</p>`;
            document.getElementById('continue-btn').style.pointerEvents = 'none';
            document.getElementById('continue-btn').style.opacity = '.5';
          });

        document.getElementById('continue-btn').addEventListener('click', async e => {
          e.preventDefault();
          if (!battery) return;
          const btn = e.currentTarget;
          btn.style.pointerEvents = 'none';
          btn.textContent = 'Creating booking…';
          try {
            const booking = await PowerShareAPI.createBooking({
              batteryId: Number(battery.id),
              startDate: start.value,
              endDate: end.value,
              quantity: qty
            });
            PowerShare.store.set('currentBooking', {
              bookingId: booking.id, batteryId: booking.batteryId, batteryName: booking.batteryName,
              qty: booking.quantity, start: booking.startDate, end: booking.endDate,
              total: Number(booking.totalPrice || 0)
            });
            window.location.href = 'payment.html';
          } catch (err) {
            PowerShare.toast(err.message || 'Could not create booking', 'error');
            btn.style.pointerEvents = '';
            btn.textContent = 'Continue to payment';
          }
        });
      </script>
    </main>

  </div>
  
</body>
</html>
