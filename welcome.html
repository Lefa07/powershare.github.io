<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Welcome · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ WELCOME ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
      <div class="welcome-screen">
        <div class="welcome-illustration">
          <span class="material-icons">ev_station</span>
        </div>
        <div class="welcome-body">
          <span class="eyebrow">South Africa's battery rental network</span>
          <h1 style="margin-top:8px">Rent portable power, whenever load shedding hits.</h1>
          <p style="margin-top:8px">Book an EcoFlow battery from a hub near you, keep the essentials running, and return it when your power's back.</p>
          <div class="welcome-dots"><span class="active"></span><span></span><span></span></div>
          <div class="stack-3" style="margin-top:24px">
            <a href="register.html" class="btn btn-primary">Create account</a>
            <a href="login.html" class="btn btn-outline">Log in</a>
          </div>
        </div>
      </div>
    </main>

  </div>
  
</body>
</html>
