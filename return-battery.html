<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Return battery · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ RETURN BATTERY ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
  <header class="topbar">
    <a href="#" class="back-btn" data-href="my-rentals.html" aria-label="Go back">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <h2>Return battery</h2>
    <div class="topbar-actions"><span style="width:40px"></span></div>
  </header>
      <div class="screen-content">
        <div class="card row" style="gap:12px" id="return-summary"></div>

        <div class="section" style="margin-top:24px">
          <h3>Return checklist</h3>
          <div class="stack-2" style="margin-top:12px">
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" checked disabled> Charging cable included</label>
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" id="chk-case"> Carry case included</label>
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" id="chk-clean"> Battery is clean and dry</label>
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" id="chk-power"> Battery powers on normally</label>
          </div>
        </div>

        <div class="section">
          <h3>Condition</h3>
          <div class="chip-row" data-exclusive style="margin-top:12px">
            <button class="chip active" data-filter="good">Good condition</button>
            <button class="chip" data-filter="minor">Minor wear</button>
            <button class="chip" data-filter="damaged">Damaged</button>
          </div>
        </div>

        <div class="section">
          <h3>Photo of returned unit</h3>
          <label id="upload-box" class="card" style="margin-top:12px;border:1.5px dashed #D6D6D6;text-align:center;cursor:pointer;display:block">
            <span class="material-icons-outlined" style="font-size:36px;color:var(--color-text-muted)">add_a_photo</span>
            <p style="margin-top:6px" id="upload-label">Tap to add a photo (optional)</p>
            <input type="file" accept="image/*" style="display:none" id="upload-input">
          </label>
        </div>
      </div>

      <div class="screen-content" style="padding-top:0">
        <button class="btn btn-primary" id="submit-return">Submit return</button>
      </div>

      <script>
        const params = new URLSearchParams(window.location.search);
        const rental = PowerShare.RENTALS.find(r => r.id === params.get('id')) || PowerShare.RENTALS[0];
        const battery = PowerShare.findBattery(rental.batteryId);
        document.getElementById('return-summary').innerHTML = `
          <span class="material-icons" style="font-size:40px;color:var(--color-primary)">${battery.icon}</span>
          <div><h4>${battery.name}</h4><p style="margin-top:2px">${rental.id} &middot; due back ${rental.end}</p></div>
        `;

        document.getElementById('upload-input').addEventListener('change', function () {
          if (this.files.length) document.getElementById('upload-label').textContent = this.files[0].name + ' added';
        });

        document.getElementById('submit-return').addEventListener('click', () => {
          PowerShare.toast('Return submitted — thanks for choosing PowerShare!', 'success');
          setTimeout(() => window.location.href = 'my-rentals.html', 700);
        });
      </script>
    </main>

  </div>
  
</body>
</html>
