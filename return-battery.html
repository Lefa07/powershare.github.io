<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Return battery · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ RETURN BATTERY ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
  <header class="topbar">
    <a href="#" class="back-btn" data-href="my-rentals.html" aria-label="Go back">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <h2>Return battery</h2>
    <div class="topbar-actions"><span style="width:40px"></span></div>
  </header>
      <div class="screen-content">
        <div class="card row" style="gap:12px" id="return-summary"></div>

        <div class="section" style="margin-top:24px">
          <h3>Return checklist</h3>
          <div class="stack-2" style="margin-top:12px">
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" checked disabled> Charging cable included</label>
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" id="chk-case"> Carry case included</label>
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" id="chk-clean"> Battery is clean and dry</label>
            <label class="checkbox-row" style="align-items:center"><input type="checkbox" id="chk-power"> Battery powers on normally</label>
          </div>
        </div>

        <div class="section">
          <h3>Condition</h3>
          <div class="chip-row" data-exclusive style="margin-top:12px">
            <button class="chip active" data-filter="good">Good condition</button>
            <button class="chip" data-filter="minor">Minor wear</button>
            <button class="chip" data-filter="damaged">Damaged</button>
          </div>
        </div>

        <div class="section">
          <h3>Photo of returned unit</h3>
          <label id="upload-box" class="card" style="margin-top:12px;border:1.5px dashed #D6D6D6;text-align:center;cursor:pointer;display:block">
            <span class="material-icons-outlined" style="font-size:36px;color:var(--color-text-muted)">add_a_photo</span>
            <p style="margin-top:6px" id="upload-label">Tap to add a photo (optional)</p>
            <input type="file" accept="image/*" style="display:none" id="upload-input">
          </label>
        </div>
      </div>

      <div class="screen-content" style="padding-top:0">
        <button class="btn btn-primary" id="submit-return">Submit return</button>
      </div>

      <script>
        function fmtDate(d) {
          if (!d) return '—';
          return new Date(d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        const params = new URLSearchParams(window.location.search);
        const rentalId = params.get('id');
        const summaryEl = document.getElementById('return-summary');
        const submitBtn = document.getElementById('submit-return');

        if (!rentalId) {

          summaryEl.innerHTML = `<p>No rental was specified. Go back to My Rentals and use the Return battery button on the rental you're returning.</p>`;
          submitBtn.disabled = true;

        } else {

          summaryEl.innerHTML = `<p class="text-muted">Loading…</p>`;
          submitBtn.disabled = true;

          PowerShareAPI.getRental(rentalId)
            .then(rental => {
              summaryEl.innerHTML = `
                <span class="material-icons" style="font-size:40px;color:var(--color-primary)">battery_full</span>
                <div><h4>${rental.batteryName}</h4><p style="margin-top:2px">Rental #${rental.id} · due back ${fmtDate(rental.dueDate)}</p></div>
              `;
              submitBtn.disabled = false;
            })
            .catch(err => {
              summaryEl.innerHTML = `<p>${err.message || 'Could not load this rental.'}</p>`;
            });
        }

        document.getElementById('upload-input').addEventListener('change', function () {
          if (this.files.length) document.getElementById('upload-label').textContent = this.files[0].name + ' added';
        });

        let condition = 'good';
        document.querySelectorAll('.chip-row[data-exclusive] .chip').forEach(chip => {
          chip.addEventListener('click', () => {
            condition = chip.getAttribute('data-filter');
            document.querySelectorAll('.chip-row[data-exclusive] .chip').forEach(c => c.classList.toggle('active', c === chip));
          });
        });

        // Actually confirming a return (POST /returns) is an admin-only action on
        // the backend - it's the admin physically inspecting the battery at
        // hand-back, not something the customer's own account is authorized to
        // call. So this doesn't pretend to submit anything server-side; it's a
        // checklist for the customer to bring to the hub, and the actual return
        // gets recorded from the admin's "Process return" action instead.
        submitBtn.addEventListener('click', () => {
          PowerShare.toast('Noted — bring the battery and this checklist to the hub to complete your return.', 'success');
          setTimeout(() => window.location.href = 'my-rentals.html', 1200);
        });
      </script>
    </main>

  </div>
  
</body>
</html>
