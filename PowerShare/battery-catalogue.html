<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Batteries · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ BATTERIES ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen">
  <header class="topbar">
    <a href="#" class="back-btn" data-href="home.html" aria-label="Go back">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <h2>Batteries</h2>
    <div class="topbar-actions"><span style="width:40px"></span></div>
  </header>
      <div class="screen-content">
        <div class="search-bar" style="margin-top:0;box-shadow:var(--shadow-sm)">
          <span class="material-icons-outlined">search</span>
          <input type="text" id="catalogue-search" placeholder="Search by name or capacity...">
        </div>

        <div class="chip-row" data-exclusive style="margin-top:16px">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="Compact">Compact</button>
          <button class="chip" data-filter="Portable">Portable</button>
          <button class="chip" data-filter="Heavy Duty">Heavy Duty</button>
        </div>

        <div class="row-between" style="margin-top:16px">
          <span class="text-muted" style="font-size:13px" id="result-count">6 batteries available near you</span>
          <button class="btn-icon" data-open-sheet="filter-sheet" aria-label="More filters">
            <span class="material-icons-outlined" style="font-size:19px">tune</span>
          </button>
        </div>

        <div class="stack-3" style="margin-top:16px" id="battery-grid" data-stagger></div>
      </div>

      <div class="overlay" id="filter-sheet">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <h3>Filter batteries</h3>
          <div class="field" style="margin-top:20px">
            <label>Pickup location</label>
            <select><option>Any hub</option><option>Claremont Hub</option><option>Sea Point Hub</option><option>Bellville Hub</option></select>
          </div>
          <div class="field">
            <label>Price range</label>
            <select><option>Any price</option><option>Under R100/day</option><option>R100 &ndash; R250/day</option><option>Over R250/day</option></select>
          </div>
          <label class="checkbox-row"><input type="checkbox" checked> Only show available now</label>
          <button class="btn btn-primary" data-close-sheet style="margin-top:20px">Apply filters</button>
        </div>
      </div>

      <script>
        const grid = document.getElementById('battery-grid');
        const resultCount = document.getElementById('result-count');
        const searchInput = document.getElementById('catalogue-search');
        let activeCategory = 'all';

        function statusBadge(status) {
          if (status === 'available') return '<span class="badge badge-available"><span class="material-icons">check_circle</span>Available</span>';
          if (status === 'low') return '<span class="badge badge-low"><span class="material-icons">warning</span>Low stock</span>';
          return '<span class="badge badge-unavailable"><span class="material-icons">block</span>Unavailable</span>';
        }

        function render() {
          const query = searchInput.value.trim().toLowerCase();
          const list = PowerShare.BATTERIES.filter(b => {
            const matchesCategory = activeCategory === 'all' || b.category === activeCategory;
            const matchesQuery = !query || b.name.toLowerCase().includes(query) || b.capacity.toLowerCase().includes(query);
            return matchesCategory && matchesQuery;
          });
          resultCount.textContent = `${list.length} batter${list.length === 1 ? 'y' : 'ies'} found`;
          grid.innerHTML = list.map(b => `
            <a href="battery-details.html?id=${b.id}" class="battery-card battery-card--row card--hover">
              <div class="battery-img"><span class="material-icons">${b.icon}</span></div>
              <div class="battery-body">
                <div class="row-between"><h4>${b.name}</h4></div>
                <p style="margin-top:2px">${b.capacity} &middot; ${b.runtime}</p>
                <div class="row-between" style="margin-top:8px">
                  <div class="price-row"><span class="price">R${b.price}</span><span class="price-unit">/day</span></div>
                  ${statusBadge(b.status)}
                </div>
              </div>
            </a>`).join('') || `
            <div class="empty-state">
              <span class="material-icons-outlined">battery_unknown</span>
              <h4>No batteries match</h4>
              <p>Try a different search or category.</p>
            </div>`;
        }

        document.querySelectorAll('.chip-row[data-exclusive] .chip').forEach(chip => {
          chip.addEventListener('click', () => { activeCategory = chip.getAttribute('data-filter'); render(); });
        });
        searchInput.addEventListener('input', render);
        render();
      </script>
    </main>
  <nav class="bottom-nav" aria-label="Primary">
    <a href="home.html" class="">
      <span class="material-icons-outlined">home</span>
      Home
    </a>
    <a href="battery-catalogue.html" class="active">
      <span class="material-icons-outlined">battery_charging_full</span>
      Batteries
    </a>
    <a href="my-rentals.html" class="">
      <span class="material-icons-outlined">receipt_long</span>
      Rentals
    </a>
    <a href="notifications.html" class="">
      <span class="material-icons-outlined">notifications</span>
      Notifications<span class="nav-badge" data-unread-count style="display:none"></span>
    </a>
    <a href="profile.html" class="">
      <span class="material-icons-outlined">person</span>
      Profile
    </a>
  </nav>
  </div>
  
</body>
</html>
