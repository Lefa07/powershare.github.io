<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers · PowerShare Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="admin-body">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ ADMIN: CUSTOMERS ============ -->
  <!-- Shared scripts load first (above) so this page's inline
       rendering script can rely on PowerShare already existing. -->
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand">
        <span class="material-icons" style="color:var(--color-accent)">bolt</span>
        <span class="name">PowerShare <span style="opacity:.6;font-weight:500">Business</span></span>
      </div>
      <nav>
        <a href="admin-dashboard.html" class="">
          <span class="material-icons-outlined">dashboard</span>
          <span class="label">Dashboard</span>
        </a>
        <a href="inventory.html" class="">
          <span class="material-icons-outlined">battery_charging_full</span>
          <span class="label">Inventory</span>
        </a>
        <a href="bookings.html" class="">
          <span class="material-icons-outlined">event_available</span>
          <span class="label">Bookings</span>
        </a>
        <a href="customers.html" class="active">
          <span class="material-icons-outlined">groups</span>
          <span class="label">Customers</span>
        </a>
        <a href="reports.html" class="">
          <span class="material-icons-outlined">bar_chart</span>
          <span class="label">Reports</span>
        </a>
        <a href="business-settings.html" class="">
          <span class="material-icons-outlined">tune</span>
          <span class="label">Business Settings</span>
        </a>
      </nav>
      <div class="logout-row">
        <a href="login.html">
          <span class="material-icons-outlined">logout</span>
          <span class="label">Log out</span>
        </a>
      </div>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <h2>Customers</h2>
        <div class="row" style="gap:16px">
          <span class="material-icons-outlined" style="color:var(--color-text-muted)">notifications</span>
          <div class="row" style="gap:8px">
            <div style="width:36px;height:36px;border-radius:50%;background:var(--color-primary-light);display:flex;align-items:center;justify-content:center;color:var(--color-primary);font-weight:700;font-family:var(--font-display)">PS</div>
            <div style="font-size:13px">
              <div style="font-weight:600">PowerShare Energy</div>
              <div class="text-muted" style="font-size:11.5px">Business admin</div>
            </div>
          </div>
        </div>
      </header>
      <div class="admin-content">
        <div class="row-between" style="margin-bottom:18px">
          <div class="search-bar" style="margin-top:0;max-width:340px;box-shadow:var(--shadow-sm)">
            <span class="material-icons-outlined">search</span>
            <input type="text" id="customer-search" placeholder="Search by name or email...">
          </div>
        </div>
        <table class="data-table">
          <thead><tr><th>Customer ID</th><th>Name</th><th>Email</th><th>Total rentals</th><th>Outstanding</th></tr></thead>
          <tbody id="customers-body"></tbody>
        </table>

        <script>
          let customers = [];

          function renderCustomers(query) {
            const q = (query || '').trim().toLowerCase();
            const list = customers.filter(c => {
              const name = `${c.firstName} ${c.lastName}`;
              return !q || name.toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q);
            });
            document.getElementById('customers-body').innerHTML = list.map(c => {
              const name = `${c.firstName} ${c.lastName}`;
              const outstanding = Number(c.outstandingBalance || 0);
              return `
                <tr>
                  <td>${c.id}</td>
                  <td>${name}</td>
                  <td>${c.email || '—'}</td>
                  <td>${c.totalRentals ?? 0}</td>
                  <td>${outstanding > 0 ? `<span class="badge badge-pending">R${outstanding.toFixed(2)} due</span>` : '<span class="badge badge-available">Settled</span>'}</td>
                </tr>`;
            }).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--color-text-muted);padding:24px">No customers match "${query || ''}"</td></tr>`;
          }

          PowerShareAPI.getMyProfile()
            .then(user => {
              if (!user || user.role !== 'ADMIN') { window.location.href = 'home.html'; return null; }
              return PowerShareAPI.admin.listUsers();
            })
            .then(data => {
              if (!data) return;
              customers = data;
              renderCustomers('');
            })
            .catch(() => {
              document.getElementById('customers-body').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--color-text-muted);padding:24px">Could not load customer data</td></tr>';
            });

          document.getElementById('customer-search').addEventListener('input', (e) => renderCustomers(e.target.value));
        </script>
      </div>
    </div>
  </div>
</body>
</html>
