<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Rentals · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ MY RENTALS ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen">
      <header class="topbar">
        <span style="width:40px"></span>
        <h2>My Rentals</h2>
        <div class="topbar-actions"><span style="width:40px"></span></div>
      </header>
      <div class="screen-content">
        <div class="tab-row" data-panels="rentals">
          <button class="active" data-target="active">Active</button>
          <button data-target="upcoming">Upcoming</button>
          <button data-target="completed">Completed</button>
        </div>

        <div data-panel-group="rentals" data-panel="active" class="stack-3" style="margin-top:18px" id="panel-active"></div>
        <div data-panel-group="rentals" data-panel="upcoming" class="stack-3" style="margin-top:18px;display:none" id="panel-upcoming"></div>
        <div data-panel-group="rentals" data-panel="completed" class="stack-3" style="margin-top:18px;display:none" id="panel-completed"></div>
      </div>

      <script>
        function fmtDate(d) {
          if (!d) return '—';
          return new Date(d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        /*
         * The backend only models rental status as ACTIVE / OVERDUE /
         * RETURNED / COMPLETED — there's no "upcoming" state. An approved
         * booking's rental starts life as ACTIVE with collectedAt still
         * null (the admin hasn't handed the battery over yet), so that's
         * used as the "upcoming vs. active" split for this screen.
         */
        function bucketFor(r) {
          if (r.status === 'RETURNED' || r.status === 'COMPLETED') return 'completed';
          if (r.status === 'OVERDUE') return 'overdue';
          if (r.status === 'ACTIVE') return r.collectedAt ? 'active' : 'upcoming';
          return 'active';
        }

        function rentalCard(r) {
          const badgeMap = { active: 'badge-active', upcoming: 'badge-pending', completed: 'badge-completed', overdue: 'badge-unavailable', pending: 'badge-pending' };
          const labelMap = { active: 'Active', upcoming: 'Upcoming', completed: 'Completed', overdue: 'Overdue', pending: 'Pending approval' };
          return `
            <a href="${r.href || `rental-details.html?id=${r.id}`}" class="card rental-card card--hover">
              <div class="rental-thumb"><span class="material-icons-outlined">battery_full</span></div>
              <div style="flex:1">
                <div class="row-between"><h4>${r.batteryName}</h4><span class="badge ${badgeMap[r.bucket]}">${labelMap[r.bucket]}</span></div>
                <p style="margin-top:2px">${r.id} &middot; ${fmtDate(r.startDate)} &rarr; ${fmtDate(r.dueDate)}</p>
                <div class="row-between" style="margin-top:6px">
                  <span class="text-muted" style="font-size:12.5px">Total</span>
                  <strong style="font-size:13.5px">${r.totalPrice != null ? `R${r.totalPrice}` : '—'}</strong>
                </div>
              </div>
            </a>`;
        }

        function emptyState(label) {
          return `<div class="empty-state"><span class="material-icons-outlined">inbox</span><h4>No ${label} rentals</h4><p>Batteries you rent will show up here.</p></div>`;
        }

        PowerShareAPI.getMyProfile()
          .catch(() => { window.location.href = 'login.html'; });

        Promise.all([
          PowerShareAPI.getMyRentals(),
          PowerShareAPI.getMyBookings()
        ])
          .then(([rentals, bookings]) => {
            const bookingsById = new Map(bookings.map(b => [b.id, b]));

            const enriched = rentals.map((r) => {
              const booking = bookingsById.get(r.bookingId);
              return {
                ...r,
                startDate: booking ? booking.startDate : null,
                totalPrice: booking ? booking.totalPrice : null,
                bucket: bucketFor(r)
              };
            });

            /*
             * A booking only becomes a Rental once an admin approves it - so a
             * booking that's just been paid for and is still awaiting approval
             * has no rental to show here at all, even though the customer very
             * reasonably expects to see it immediately after paying. These are
             * shown as their own "Pending approval" cards in Upcoming, linking
             * to the notifications page's tracker rather than rental-details
             * (which needs a real rental id that doesn't exist yet).
             */
            const pending = bookings
              .filter(b => b.status === 'PENDING')
              .map(b => ({
                id: `Booking #${b.id}`,
                batteryName: b.batteryName,
                startDate: b.startDate,
                dueDate: b.endDate,
                totalPrice: b.totalPrice,
                bucket: 'pending',
                href: 'notifications.html'
              }));

            const active = enriched.filter(r => r.bucket === 'active' || r.bucket === 'overdue');
            const upcoming = [...pending, ...enriched.filter(r => r.bucket === 'upcoming')];
            const completed = enriched.filter(r => r.bucket === 'completed');

            document.getElementById('panel-active').innerHTML = active.map(rentalCard).join('') || emptyState('active');
            document.getElementById('panel-upcoming').innerHTML = upcoming.map(rentalCard).join('') || emptyState('upcoming');
            document.getElementById('panel-completed').innerHTML = completed.map(rentalCard).join('') || emptyState('completed');
          })
          .catch(() => {
            ['panel-active', 'panel-upcoming', 'panel-completed'].forEach((id) => {
              document.getElementById(id).innerHTML =
                `<p class="text-muted" style="padding:12px 4px">Couldn't load your rentals right now.</p>`;
            });
          });
      </script>
    </main>
  <nav class="bottom-nav" aria-label="Primary">
    <a href="home.html" class="">
      <span class="material-icons-outlined">home</span>
      <span data-i18n="Home">Home</span>
    </a>
    <a href="battery-catalogue.html" class="">
      <span class="material-icons-outlined">battery_charging_full</span>
      <span data-i18n="Batteries">Batteries</span>
    </a>
    <a href="my-rentals.html" class="active">
      <span class="material-icons-outlined">receipt_long</span>
      <span data-i18n="Rentals">Rentals</span>
    </a>
    <a href="notifications.html" class="">
      <span class="material-icons-outlined">notifications</span>
      <span data-i18n="Notifications">Notifications</span><span class="nav-badge" data-unread-count style="display:none"></span>
    </a>
    <a href="profile.html" class="">
      <span class="material-icons-outlined">person</span>
      <span data-i18n="Profile">Profile</span>
    </a>
  </nav>
  </div>
  
</body>
</html>
