<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign up · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ SIGN UP ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
      <div class="screen-content">
        <div style="padding-top:24px;margin-bottom:32px">
          <div class="splash-logo" style="width:56px;height:56px;border-radius:16px;background:var(--color-primary-light)">
            <span class="material-icons" style="font-size:28px;color:var(--color-primary)">bolt</span>
          </div>
        </div>
        <h1>Create your account</h1>
        <p style="margin-top:6px">Sign up to start booking and managing battery rentals.</p>
 
        <form id="register-form" class="stack-4" style="margin-top:28px" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="register-first-name">First name</label>
              <div class="input-wrap">
                <span class="material-icons-outlined">person_outline</span>
                <input type="text" id="register-first-name" placeholder="Lefa" autocomplete="given-name">
              </div>
              <div class="error-msg">First name is required.</div>
            </div>
            <div class="field">
              <label for="register-last-name">Last name</label>
              <div class="input-wrap">
                <span class="material-icons-outlined">person_outline</span>
                <input type="text" id="register-last-name" placeholder="Mabotja" autocomplete="family-name">
              </div>
              <div class="error-msg">Last name is required.</div>
            </div>
          </div>
 
          <div class="field">
            <label for="register-email">Email</label>
            <div class="input-wrap">
              <span class="material-icons-outlined">mail_outline</span>
              <input type="email" id="register-email" placeholder="you@example.co.za" autocomplete="email">
            </div>
            <div class="error-msg">Enter a valid email address.</div>
          </div>
 
          <div class="field">
            <label for="register-phone">Phone (optional)</label>
            <div class="input-wrap">
              <span class="material-icons-outlined">call</span>
              <input type="tel" id="register-phone" placeholder="+27 82 123 4567" autocomplete="tel">
            </div>
          </div>
 
          <div class="field">
            <label for="register-password">Password</label>
            <div class="input-wrap">
              <span class="material-icons-outlined">lock_outline</span>
              <input type="password" id="register-password" placeholder="At least 8 characters" autocomplete="new-password">
              <button type="button" class="toggle-visibility" aria-label="Show password">
                <span class="material-icons-outlined">visibility</span>
              </button>
            </div>
            <div class="error-msg">Password is required.</div>
          </div>
 
          <div class="field">
            <label for="register-confirm-password">Confirm password</label>
            <div class="input-wrap">
              <span class="material-icons-outlined">lock_outline</span>
              <input type="password" id="register-confirm-password" placeholder="Re-enter your password" autocomplete="new-password">
              <button type="button" class="toggle-visibility" aria-label="Show password">
                <span class="material-icons-outlined">visibility</span>
              </button>
            </div>
          </div>
 
          <button type="submit" class="btn btn-primary" style="margin-top:8px">Create account</button>
        </form>
 
        <div class="row" style="justify-content:center;gap:6px;margin-top:24px;font-size:13.5px">
          <span class="text-muted">Already have an account?</span>
          <a href="login.html" style="font-weight:700;color:var(--color-primary)">Log in</a>
        </div>
      </div>
 
      <script>
        document.getElementById('register-form').addEventListener('submit', function (e) {
          e.preventDefault();
 
          const firstNameField = document.getElementById('register-first-name').closest('.field');
          const lastNameField = document.getElementById('register-last-name').closest('.field');
          const emailField = document.getElementById('register-email').closest('.field');
          const passwordField = document.getElementById('register-password').closest('.field');
 
          const firstNameOk = PowerShare.validateField(firstNameField, [PowerShare.validators.required]);
          const lastNameOk = PowerShare.validateField(lastNameField, [PowerShare.validators.required]);
          const emailOk = PowerShare.validateField(emailField, [PowerShare.validators.required, PowerShare.validators.email]);
          const passwordOk = PowerShare.validateField(passwordField, [PowerShare.validators.required]);
 
          if (!firstNameOk || !lastNameOk || !emailOk || !passwordOk) return;
 
          const password = document.getElementById('register-password').value;
          const confirmPassword = document.getElementById('register-confirm-password').value;
 
          // These two checks mirror constraints the backend already
          // enforces (RegisterRequest requires >= 8 chars) — checking here
          // too just avoids a round trip for the most common mistakes.
          if (password.length < 8) {
            PowerShare.toast('Password must be at least 8 characters', 'error');
            return;
          }
          if (password !== confirmPassword) {
            PowerShare.toast("Passwords don't match", 'error');
            return;
          }
 
          const submitBtn = this.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account…';
 
          const payload = {
            firstName: document.getElementById('register-first-name').value.trim(),
            lastName: document.getElementById('register-last-name').value.trim(),
            email: document.getElementById('register-email').value.trim(),
            password: password,
            phone: document.getElementById('register-phone').value.trim() || null,
          };
 
          // Register, then immediately log in with the same credentials —
          // registering only creates the account, it doesn't return a
          // token, so this chain is what gets you straight into the app
          // instead of bouncing back to the login form to type it all again.
          PowerShareAPI.register(payload)
            .then(() => PowerShareAPI.login(payload.email, payload.password))
            .then(() => {
              PowerShare.toast('Account created — welcome to PowerShare!', 'success');
              setTimeout(() => window.location.href = 'home.html', 500);
            })
            .catch((err) => {
              const fieldErrors = err.body && err.body.validationErrors;
              const detail = fieldErrors && fieldErrors.length ? fieldErrors.join('; ') : err.message;
              PowerShare.toast(detail || 'Could not create your account', 'error');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create account';
            });
        });
      </script>
    </main>
 
  </div>
  
</body>
</html>
