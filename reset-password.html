<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <main class="screen screen--no-nav">
      <header class="topbar">
        <a href="login.html" class="back-btn" data-href="login.html" aria-label="Back">
          <span class="material-icons-outlined">arrow_back</span>
        </a>
        <h2>Reset password</h2>
        <span style="width:40px"></span>
      </header>
      <div class="screen-content">
        <div class="card">
          <span class="material-icons-outlined" style="font-size:36px;color:var(--color-primary)">lock_reset</span>
          <h3 style="margin-top:10px">Create a new password</h3>
          <p style="margin-top:6px">Choose a strong password with at least 8 characters.</p>
          <form id="reset-form" class="stack-3" style="margin-top:20px" novalidate>
            <div class="field">
              <label for="new-password">New password</label>
              <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="field">
              <label for="confirm-password">Confirm password</label>
              <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn btn-primary" type="submit">Reset password</button>
          </form>
          <p id="reset-message" class="text-muted" style="margin-top:14px"></p>
        </div>
      </div>
      <script src="js/powershare-api.js"></script>
      <script src="js/main.js"></script>
      <script src="js/navigation.js"></script>
      <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const form = document.getElementById('reset-form');
        const message = document.getElementById('reset-message');

        if (!token) {
          form.querySelector('button').disabled = true;
          message.textContent = 'This reset link is missing or invalid. Please request a new one from the login page.';
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const newPassword = document.getElementById('new-password').value;
          const confirm = document.getElementById('confirm-password').value;
          if (newPassword.length < 8) {
            PowerShare.toast('Password must be at least 8 characters.', 'error');
            return;
          }
          if (newPassword !== confirm) {
            PowerShare.toast('Passwords do not match.', 'error');
            return;
          }

          const button = form.querySelector('button');
          button.disabled = true;
          button.textContent = 'Resetting…';
          try {
            const result = await PowerShareAPI.resetPassword(token, newPassword);
            PowerShare.toast(result?.message || 'Password reset successfully.', 'success');
            setTimeout(() => window.location.href = 'login.html', 900);
          } catch (err) {
            PowerShare.toast(err.message || 'Could not reset password.', 'error');
            button.disabled = false;
            button.textContent = 'Reset password';
          }
        });
      </script>
    </main>
  </div>
</body>
</html>
