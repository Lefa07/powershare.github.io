<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Battery details · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ BATTERY DETAILS ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
  <header class="topbar">
    <a href="#" class="back-btn" data-href="battery-catalogue.html" aria-label="Go back">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <h2>Battery details</h2>
    <div class="topbar-actions"><span style="width:40px"></span></div>
  </header>
      <div class="screen-content" id="details-root">
        <div class="booking-flow-note">
          <span class="material-icons-outlined">info</span>
          <span>Choose your battery here. Next, select your rental dates and continue to payment.</span>
        </div>
        <!-- Populated by JS from the selected battery id -->
      </div>

      <script>
        const params = new URLSearchParams(window.location.search);
        const batteryId = params.get('id');
        const root = document.getElementById('details-root');

        PowerShareAPI.getBattery(batteryId).then(battery => {
          const chargePct = PowerShareAPI.conditionToChargePct(battery.condition);
          const available = battery.status === 'AVAILABLE';
          const statusBadge = available
            ? '<span class="badge badge-available"><span class="material-icons">check_circle</span>Available now</span>'
            : '<span class="badge badge-unavailable"><span class="material-icons">block</span>Unavailable</span>';

          root.innerHTML = `
            <div class="card" style="text-align:center;padding:32px 16px"><span class="material-icons" style="font-size:88px;color:var(--color-primary)">${PowerShareAPI.iconForCategory(battery.category?.name)}</span></div>
            <div class="row-between" style="margin-top:20px"><div><span class="eyebrow">${battery.category?.name || 'Battery'}</span><h1 style="margin-top:2px">${battery.name}</h1></div><div class="charge-ring charge-ring--sm" style="--charge-pct:${chargePct}%"><span class="charge-value">${chargePct}%</span></div></div>
            <div style="margin-top:8px">${statusBadge}</div>
            <div class="card stack-3" style="margin-top:20px">
              <div class="row-between"><span class="text-muted">Capacity</span><strong>${battery.capacityWh}Wh</strong></div>
              <div class="row-between"><span class="text-muted">Runtime</span><strong>${battery.runtimeHours ?? '—'} hrs</strong></div>
              <div class="row-between"><span class="text-muted">Daily rate</span><strong>R${battery.rentalPricePerDay}</strong></div>
              <div class="row-between"><span class="text-muted">Status</span><strong>${battery.status}</strong></div>
            </div>`;

          const bookBtn = document.createElement('a');
          bookBtn.className = 'btn btn-primary'; bookBtn.style.marginTop = '24px';
          bookBtn.textContent = available ? 'Book now' : 'Unavailable';
          bookBtn.href = available ? `booking.html?id=${battery.id}` : '#';
          if (!available) bookBtn.addEventListener('click', e => e.preventDefault());
          root.appendChild(bookBtn);
        }).catch(err => {
          root.innerHTML = `<div class="empty-state"><span class="material-icons-outlined">battery_unknown</span><h4>Could not load battery</h4><p>${err.message || 'Please try again.'}</p></div>`;
        });
      </script>
    </main>

  </div>
  
</body>
</html>
