<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Booking confirmed · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ BOOKING CONFIRMED ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
      <div class="screen-content" style="text-align:center;padding-top:40px">
        <div class="success-badge"><span class="material-icons">check</span></div>
        <h1 style="margin-top:20px">Payment successful!</h1>
        <p style="margin-top:6px">Your booking has been paid for and is now pending admin approval. You'll get a notification once it's reviewed.</p>

        <div class="qr-box"><span class="material-icons">qr_code_2</span></div>
        <p class="text-muted" style="margin-top:4px;font-size:12.5px">Show this QR code at the hub once your booking is approved, to collect your battery.</p>
        <div class="eyebrow" id="booking-number">Booking PS-00000</div>

        <div class="card stack-1" style="margin-top:24px;text-align:left" id="receipt"></div>

        <div class="stack-3" style="margin-top:28px">
          <a href="my-rentals.html" class="btn btn-primary">View my rentals</a>
          <a href="home.html" class="btn btn-outline">Back to home</a>
        </div>
      </div>

      <script>
        let booking = PowerShare.store.get('currentBooking');
        const lastPayment = PowerShare.store.get('lastPayment');
        const params = new URLSearchParams(window.location.search);
        const urlBookingId = params.get('bookingId');

        function fmtDateTime(d) {
          if (!d) return '';
          return new Date(d).toLocaleString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function renderReceipt() {
          const bookingNumber = booking?.bookingId ? `Booking #${booking.bookingId}` : 'Booking submitted';
          document.getElementById('booking-number').textContent = bookingNumber;
          const receipt = document.getElementById('receipt');
          if (booking) {
            // lastPayment is only shown when it actually belongs to this
            // booking - if the page was reopened for an older booking, an
            // unrelated payment from a previous session shouldn't appear here.
            const payment = (lastPayment && String(lastPayment.bookingId) === String(booking.bookingId)) ? lastPayment : null;
            receipt.innerHTML = `
              <div class="receipt-line"><span>Battery</span><span>${booking.batteryName}</span></div>
              <div class="receipt-line"><span>Quantity</span><span>${booking.qty}</span></div>
              <div class="receipt-line"><span>Rental period</span><span>${booking.start} → ${booking.end}</span></div>
              <div class="divider" style="margin:6px 0"></div>
              ${payment ? `
              <div class="receipt-line"><span>Transaction ID</span><span style="font-family:monospace">${payment.transactionReference}</span></div>
              <div class="receipt-line"><span>Payment method</span><span>${payment.method}</span></div>
              <div class="receipt-line"><span>Paid at</span><span>${fmtDateTime(payment.paymentDate)}</span></div>
              <div class="receipt-line"><span>Amount paid</span><span>R${Number(payment.amount || 0).toFixed(2)}</span></div>
              ` : `
              <div class="receipt-line"><span>Total</span><span>R${Number(booking.total || 0).toFixed(2)}</span></div>
              `}
              <div class="divider" style="margin:6px 0"></div>
              <div class="receipt-line"><span style="font-weight:700;color:var(--color-text)">Booking status</span><span style="font-weight:700;color:var(--color-accent-dark)">Pending approval</span></div>`;
          }
        }

        function toBookingShape(b) {
          return {
            bookingId: b.id, batteryId: b.batteryId, batteryName: b.batteryName,
            qty: b.quantity, start: b.startDate, end: b.endDate, total: Number(b.totalPrice || 0)
          };
        }

        // Same resolution order as payment.html - see the comment there for why.
        function resolveBooking() {
          if (urlBookingId) {
            return PowerShareAPI.getBooking(urlBookingId).then(toBookingShape);
          }
          if (booking?.bookingId) {
            return Promise.resolve(booking);
          }
          return PowerShareAPI.getMyBookings()
            .then((bookings) => {
              const pending = (bookings || []).filter(b => b.status === 'PENDING').sort((a, b) => b.id - a.id);
              return pending.length ? toBookingShape(pending[0]) : null;
            })
            .catch(() => null);
        }

        resolveBooking()
          .then((resolved) => {
            booking = resolved;
            if (booking) PowerShare.store.set('currentBooking', booking);
          })
          .catch(() => {
            // Same reasoning as payment.html: never leave this page silently
            // stuck - any resolution failure must still render something.
            booking = null;
          })
          .then(renderReceipt);
      </script>
    </main>

  </div>
  
</body>
</html>
