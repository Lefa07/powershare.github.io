<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notifications · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/powershare-api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ NOTIFICATIONS ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen">
      <header class="topbar">
        <span style="width:40px"></span>
        <h2>Booking progress</h2>
        <div class="topbar-actions">
          <button class="btn-icon" id="mark-read-btn" aria-label="Mark all updates as read">
            <span class="material-icons-outlined" style="font-size:19px">done_all</span>
          </button>
        </div>
      </header>
      <div class="screen-content stack-3">
        <div id="progress-list" class="stack-3" data-stagger></div>
        <div class="section">
          <div class="section-head"><h3>Updates</h3></div>
          <div id="notif-list" class="stack-2" style="margin-top:10px"></div>
        </div>
      </div>

      <script>
        const iconMap = {
          BOOKING_CREATED: 'event',
          BOOKING_APPROVED: 'check_circle',
          BOOKING_REJECTED: 'cancel',
          PAYMENT_SUCCESSFUL: 'payments'
        };
        const colorMap = {
          BOOKING_CREATED: 'var(--color-accent-dark)',
          BOOKING_APPROVED: 'var(--color-success)',
          BOOKING_REJECTED: 'var(--color-error)',
          PAYMENT_SUCCESSFUL: 'var(--color-primary)'
        };

        const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
        }[c]));

        function renderProgress(progressItems) {
          const root = document.getElementById('progress-list');
          if (!progressItems.length) {
            root.innerHTML = `
              <div class="empty-state">
                <span class="material-icons-outlined">timeline</span>
                <h4>No active bookings</h4>
                <p>When you book a battery, its progress will appear here.</p>
                <a class="btn btn-primary btn-sm" href="battery-catalogue.html" style="width:auto;margin-top:10px">Browse batteries</a>
              </div>`;
            return;
          }

          root.innerHTML = progressItems.map(item => {
            const completed = item.steps.filter(s => s.status === 'complete').length;
            return `
              <div class="card">
                <div class="row-between">
                  <div>
                    <span class="text-muted" style="font-size:11px">POWERBANK RENTAL #${esc(item.bookingId)}</span>
                    <h3 style="margin-top:3px">${esc(item.batteryName)}</h3>
                  </div>
                  <span class="badge">${completed}/${item.steps.length}</span>
                </div>
                <div style="margin-top:18px">
                  ${item.steps.map((step, index) => `
                    <div style="display:flex;gap:12px;position:relative;padding-bottom:${index === item.steps.length-1 ? '0' : '16px'}">
                      ${index < item.steps.length-1 ? '<span style="position:absolute;left:12px;top:25px;bottom:0;width:2px;background:var(--color-border,#E0E0E0)"></span>' : ''}
                      <span style="width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;z-index:1;
                        background:${step.status === 'complete' ? 'var(--color-success)' : step.status === 'current' ? 'var(--color-primary)' : step.status === 'cancelled' ? 'var(--color-error)' : 'var(--color-bg,#F5F5F5)'};
                        color:${['complete','current','cancelled'].includes(step.status) ? '#fff' : 'var(--color-text-muted)'};
                        border:1px solid var(--color-border,#E0E0E0)">
                        <span class="material-icons-outlined" style="font-size:16px">${step.status === 'complete' ? 'check' : step.status === 'cancelled' ? 'close' : step.status === 'current' ? 'radio_button_checked' : 'radio_button_unchecked'}</span>
                      </span>
                      <div style="padding-top:3px">
                        <strong style="font-size:13px">${esc(step.label)}</strong>
                        ${step.status === 'current' ? '<p class="text-muted" style="margin-top:2px;font-size:11px">Current step</p>' : ''}
                        ${step.status === 'cancelled' ? '<p style="margin-top:2px;font-size:11px;color:var(--color-error)">Workflow stopped</p>' : ''}
                      </div>
                    </div>`).join('')}
                </div>
              </div>`;
          }).join('');
        }

        function renderNotifications(list) {
          const root = document.getElementById('notif-list');
          root.innerHTML = list.length ? list.slice(0, 5).map(n => `
            <div class="card row" style="gap:12px;${n.isRead ? 'opacity:0.65' : ''}">
              <span class="material-icons-outlined" style="color:${colorMap[n.type] || 'var(--color-primary)'};font-size:26px">${iconMap[n.type] || 'notifications'}</span>
              <div style="flex:1">
                <div class="row-between"><h4>${esc(n.type.replaceAll('_', ' '))}</h4>${!n.isRead ? '<span style="width:8px;height:8px;border-radius:50%;background:var(--color-error);flex-shrink:0"></span>' : ''}</div>
                <p style="margin-top:2px">${esc(n.message)}</p>
                <span class="text-muted" style="font-size:11.5px">${new Date(n.createdAt).toLocaleString('en-ZA')}</span>
              </div>
            </div>`).join('') : '<p class="text-muted">No new updates.</p>';
        }

        let notifications = [];
        Promise.all([
          PowerShareAPI.getMyBookings(),
          PowerShareAPI.getMyNotifications(false)
        ]).then(async ([bookings, updates]) => {
          const progress = await Promise.all((bookings || []).slice(0, 10).map(b => PowerShareAPI.getBookingProgress(b.id)));
          renderProgress(progress.filter(Boolean));
          notifications = updates || [];
          renderNotifications(notifications);
        }).catch(() => {
          document.getElementById('progress-list').innerHTML = '<div class="empty-state"><h4>Could not load booking progress</h4><p>Please try again.</p></div>';
          renderNotifications(notifications);
        });

        document.getElementById('mark-read-btn').addEventListener('click', async () => {
          try {
            await Promise.all(notifications.filter(n => !n.isRead).map(n => PowerShareAPI.markNotificationRead(n.id)));
            notifications.forEach(n => n.isRead = true);
            renderNotifications(notifications);
            PowerShare.toast('Updates marked as read', 'success');
          } catch (err) {
            PowerShare.toast(err.message || 'Could not update notifications', 'error');
          }
        });
      </script>
    </main>
  <nav class="bottom-nav" aria-label="Primary">
    <a href="home.html" class="">
      <span class="material-icons-outlined">home</span>
      Home
    </a>
    <a href="battery-catalogue.html" class="">
      <span class="material-icons-outlined">battery_charging_full</span>
      Batteries
    </a>
    <a href="my-rentals.html" class="">
      <span class="material-icons-outlined">receipt_long</span>
      Rentals
    </a>
    <a href="notifications.html" class="active">
      <span class="material-icons-outlined">notifications</span>
      Notifications<span class="nav-badge" data-unread-count style="display:none"></span>
    </a>
    <a href="profile.html" class="">
      <span class="material-icons-outlined">person</span>
      Profile
    </a>
  </nav>
  </div>
  
</body>
</html>
