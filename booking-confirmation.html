<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Booking confirmed · PowerShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
</head>
<body class="">
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <!-- ============ BOOKING CONFIRMED ============ -->
  <!-- Shared scripts load first (above) so every per-page inline
       script below can rely on PowerShare/main.js already being
       defined, even though those inline scripts run immediately
       as the parser reaches them (they are not deferred). -->
  <div class="app-shell">
    <main class="screen screen--no-nav">
      <div class="screen-content" style="text-align:center;padding-top:40px">
        <div class="success-badge"><span class="material-icons">check</span></div>
        <h1 style="margin-top:20px">Booking confirmed!</h1>
        <p style="margin-top:6px">Show the QR code at the hub to collect your battery.</p>

        <div class="qr-box"><span class="material-icons">qr_code_2</span></div>
        <div class="eyebrow" id="booking-number">Booking PS-00000</div>

        <div class="card stack-1" style="margin-top:24px;text-align:left" id="receipt"></div>

        <div class="stack-3" style="margin-top:28px">
          <a href="my-rentals.html" class="btn btn-primary">View my rentals</a>
          <a href="home.html" class="btn btn-outline">Back to home</a>
        </div>
      </div>

      <script>
        const booking = PowerShare.store.get('currentBooking');
        const bookingNumber = 'PS-' + Math.floor(40000 + Math.random() * 9000);
        document.getElementById('booking-number').textContent = 'Booking ' + bookingNumber;
        const receipt = document.getElementById('receipt');
        if (booking) {
          receipt.innerHTML = `
            <div class="receipt-line"><span>Battery</span><span>${booking.batteryName}</span></div>
            <div class="receipt-line"><span>Quantity</span><span>${booking.qty}</span></div>
            <div class="receipt-line"><span>Rental period</span><span>${booking.start} &rarr; ${booking.end}</span></div>
            <div class="receipt-line"><span>Rental cost</span><span>R${booking.rentalCost}</span></div>
            <div class="receipt-line"><span>Deposit (refundable)</span><span>R${booking.deposit}</span></div>
            <div class="divider" style="margin:6px 0"></div>
            <div class="receipt-line"><span style="font-weight:700;color:var(--color-text)">Total paid</span><span style="font-weight:700;color:var(--color-primary)">R${booking.total}</span></div>
          `;
        }
      </script>
    </main>

  </div>
  
</body>
</html>
